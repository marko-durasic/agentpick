name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o agentpick ./cmd/agentpick
      - name: Help
        run: ./agentpick --help
      - name: List
        run: ./agentpick list
